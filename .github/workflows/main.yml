name: Build and Release YTMusicUltimate
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file (or leave empty and use ipa_asset)"
        default: ""
        required: false
        type: string

      ipa_asset:
        description: "GitHub API URL of a draft-release asset in this repo holding the base IPA"
        default: ""
        required: false
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube Music"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtubemusic"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTMusicUltimate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6.0.2
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make dpkg-dev file unzip wget curl git \
            build-essential pkg-config libplist-dev libssl-dev libxml2-dev \
            zlib1g-dev python3-pip fakeroot xz-utils
          git clone -q --depth=1 https://github.com/ProcursusTeam/ldid /tmp/ldid-src
          make -C /tmp/ldid-src -j"$(nproc)"
          sudo install -m 0755 /tmp/ldid-src/ldid /usr/local/bin/ldid
          ldid -h 2>&1 | head -2

      - name: Set THEOS environment variable
        run: echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        env:
          cache-name: theos_cache_344ee59
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk "$THEOS/sdks"

      - name: Install iOS toolchain
        run: |
          if [ -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            echo "toolchain already present (cache)"
          else
            mkdir -p "$THEOS/toolchain"
            curl -sSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
              | tar -xJf - -C "$THEOS/toolchain"
          fi
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -2
          ldid -h 2>&1 | head -1

      - name: Install cyan
        run: |
          python3 -m pip install --break-system-packages -q \
            "https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip"
          cyan --help 2>&1 | head -2

      - name: Fetch base IPA
        env:
          ASSET_URL: ${{ inputs.ipa_asset }}
        run: |
          if [ -n "$ASSET_URL" ]; then
            echo "downloading base IPA from repo asset"
            curl -fsSL -H "Authorization: token ${{ github.token }}" \
                        -H "Accept: application/octet-stream" \
                        "$ASSET_URL" -o ytm.ipa
          else
            wget "${{ inputs.ipa_url }}" --no-verbose -O ytm.ipa
          fi

      - name: Validate base IPA
        run: |
          ls -l ytm.ipa
          t=$(file --mime-type -b ytm.ipa)
          echo "detected: $t"
          case "$t" in
            application/zip|application/x-ios-app) ;;
            *) echo "::error::not an IPA: $t"; exit 1 ;;
          esac
          unzip -l ytm.ipa | grep -qE "Payload/[^/]+\.app/" || { echo "::error::no Payload/*.app"; exit 1; }
          echo "base IPA looks valid"

      - name: Build Tweak for Sideloading
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1 SIDELOADING=1
          ls -l packages/
          mv packages/*.deb ../ytmult.deb

      - name: Inject tweak into provided IPA
        run: |
          set -e
          TWEAKED=0
          if python3 - <<'PY'
          import sys, zipfile
          d = zipfile.ZipFile('ytm.ipa').read('Payload/YouTubeMusic.app/YouTubeMusic')
          sys.exit(0 if b'@rpath/YTMusicUltimate.dylib' in d else 1)
          PY
          then TWEAKED=1; fi

          if [ "$TWEAKED" = "1" ]; then
            echo "base is already tweaked -> replacing dylib/bundle in place (keeps a single load command)"
            python3 - <<'PY'
          import os, shutil, subprocess, tempfile, zipfile

          ipa, deb, out = 'ytm.ipa', 'ytmult.deb', 'YTMusicUltimate.ipa'
          app = 'Payload/YouTubeMusic.app/'
          tmp = tempfile.mkdtemp()
          subprocess.run(['dpkg-deb', '-x', deb, tmp], check=True)

          dylibs = [os.path.join(r, f) for r, _, fs in os.walk(tmp) for f in fs if f.endswith('.dylib')]
          if not dylibs:
              raise SystemExit('no dylib inside the deb')
          targets = {app + 'Frameworks/' + os.path.basename(dylibs[0]): open(dylibs[0], 'rb').read()}

          bundle = os.path.join(tmp, 'Library/Application Support/YTMusicUltimate.bundle')
          if os.path.isdir(bundle):
              for root, _, files in os.walk(bundle):
                  for f in files:
                      full = os.path.join(root, f)
                      rel = os.path.relpath(full, bundle).replace(os.sep, '/')
                      targets[app + 'YTMusicUltimate.bundle/' + rel] = open(full, 'rb').read()

          zin = zipfile.ZipFile(ipa)
          replaced = 0
          added = 0
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zout:
              for n in zin.namelist():
                  zi = zin.getinfo(n)
                  data = targets.pop(n, None)
                  if data is not None:
                      replaced += 1
                  else:
                      data = zin.read(n)
                  ni = zipfile.ZipInfo(n, date_time=zi.date_time)
                  ni.compress_type = zipfile.ZIP_DEFLATED
                  ni.external_attr = zi.external_attr
                  zout.writestr(ni, data)
              for n, data in targets.items():
                  ni = zipfile.ZipInfo(n, date_time=(2026, 1, 1, 0, 0, 0))
                  ni.compress_type = zipfile.ZIP_DEFLATED
                  zout.writestr(ni, data)
                  added += 1
          print(f'in-place replace done: {replaced} replaced, {added} added')
          PY
          else
            echo "clean base -> cyan injection"
            cyan -i ytm.ipa -o YTMusicUltimate.ipa -uwsf ytmult.deb \
                 -n "${{ inputs.display_name }}" -b "${{ inputs.bundle_id }}"
          fi
          ls -l YTMusicUltimate.ipa

      - name: Verify injected IPA
        run: |
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('YTMusicUltimate.ipa')
          names = z.namelist()
          dyl = [n for n in names if n.endswith('YTMusicUltimate.dylib')]
          print('entries:', len(names))
          print('tweak dylib:', dyl or 'MISSING')
          if not dyl:
              raise SystemExit('injection failed: dylib not in IPA')
          import struct
          b = z.read(dyl[0])
          magic = struct.unpack_from('<I', b, 0)[0]
          print('dylib magic:', hex(magic), 'size:', len(b))
          exe = z.read('Payload/YouTubeMusic.app/YouTubeMusic')
          n = exe.count(b'@rpath/YTMusicUltimate.dylib')
          print('dylib load command occurrences:', n)
          if n != 1:
              raise SystemExit(f'expected exactly 1 load command, found {n}')
          PY
          unzip -p YTMusicUltimate.ipa "Payload/*/Info.plist" > /tmp/Info.plist
          grep -a -o "com\.google\.ios\.youtubemusic" /tmp/Info.plist | head -1 || true

      - name: Create Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          name: YTMusicUltimate (${{ github.run_number }})
          tag_name: build-${{ github.run_number }}
          files: YTMusicUltimate.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
